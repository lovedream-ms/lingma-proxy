name: Windows and Ubuntu 20.04 Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION (for example v1.6.13)
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -ne ('v' + (Get-Content VERSION -Raw).Trim())) { throw 'Tag does not match VERSION' }
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/build-all.ps1 -Target Windows
          & ./cache/toolchain/go/bin/go.exe test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./cache/toolchain/go/bin/go.exe vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/*.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install Focal build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev desktop-file-utils
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Build and test
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          npm ci --prefix desktop/frontend
          npm run build --prefix desktop/frontend
          go test -tags legacy_appindicator ./...
          go vet -tags legacy_appindicator ./...
          SKIP_FRONTEND=1 bash scripts/build-ubuntu2004-gui.sh "$PWD" "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu20-desktop
          path: dist/*.deb
          if-no-files-found: error
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/*.exe
            artifacts/*.deb
